# What the control plane may do, stated as narrowly as the API allows.
#
# A Role, not a ClusterRole: the allocator only ever touches its own namespace, so it must not be
# *able* to touch anyone else's. The four kinds are the four it manages — pods, services, PVCs and
# per-box token secrets — and the verbs are exactly the calls the client makes: create, get (by
# name), update (apply is create-or-replace), delete. No list, no watch, no exec, no port-forward:
# readiness is polled with get, nothing enumerates the namespace, and this identity never needs a
# shell inside a tenant's box.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentbox-control
  namespace: agentbox
  labels:
    app.kubernetes.io/managed-by: agentbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentbox-control
  namespace: agentbox
  labels:
    app.kubernetes.io/managed-by: agentbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create", "update", "delete"]
  # Secrets hold every tenant's box tokens, which is exactly why the verbs stop at what apply
  # needs — `get` is by name, and without `list` this identity cannot enumerate every tenant's
  # credentials in one call.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentbox-control
  namespace: agentbox
  labels:
    app.kubernetes.io/managed-by: agentbox
subjects:
  - kind: ServiceAccount
    name: agentbox-control
    namespace: agentbox
roleRef:
  kind: Role
  name: agentbox-control
  apiGroup: rbac.authorization.k8s.io
