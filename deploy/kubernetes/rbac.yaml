# What the control plane may do, stated as narrowly as the API allows.
#
# A Role, not a ClusterRole: the allocator only ever touches its own namespace, so it must not be
# *able* to touch anyone else's. The four kinds are the four it manages — pods, services, PVCs and
# per-box token secrets — and the verbs are create/get/delete plus list (for label queries) and
# update (apply is create-or-replace). No watch, no exec, no port-forward: the control plane polls
# readiness with get, and it never needs a shell inside a tenant's box from this identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentbox-control
  namespace: agentbox
  labels:
    app.kubernetes.io/managed-by: agentbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentbox-control
  namespace: agentbox
  labels:
    app.kubernetes.io/managed-by: agentbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "delete"]
  # Secrets hold every tenant's box tokens, which is exactly why this identity may create and
  # delete them but the verbs stop there in spirit — get/list are present because apply's
  # create-or-replace needs them, and anyone operating this namespace can already read them.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentbox-control
  namespace: agentbox
  labels:
    app.kubernetes.io/managed-by: agentbox
subjects:
  - kind: ServiceAccount
    name: agentbox-control
    namespace: agentbox
roleRef:
  kind: Role
  name: agentbox-control
  apiGroup: rbac.authorization.k8s.io
