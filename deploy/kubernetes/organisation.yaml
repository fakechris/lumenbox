apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentbox-organisation
  namespace: agentbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentbox-organisation
  namespace: agentbox
subjects:
  - kind: ServiceAccount
    name: agentbox-organisation
    namespace: agentbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentbox-control
---
# The organisation's state, mounted at AGENTBOX_HOME (/state). Besides the roster, agents and
# ledgers it holds `ui-token`: the machine credential the server creates on its first start
# when AGENTBOX_UI_TOKEN is unset — for the CLI inside the pod, not for a browser (README.md) —
# and the key every browser session is signed with is derived from it. Keep this claim across rollouts. Replacing it with an emptyDir, or deleting it, gives
# the next pod a new token and signs out everyone (INV-2045). If you set AGENTBOX_UI_TOKEN in
# agentbox-organisation-env instead, keep that Secret's value stable for the same reason.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentbox-organisation-state
  namespace: agentbox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# agentbox-organisation-env, the Secret the Deployment below reads with envFrom: it must exist
# before the pod starts. It holds the app of the channel the first Admin signs in through at
# /bootstrap. The server sets up its `dingtalk` and `feishu` channels by itself and reads their
# apps from its environment by the channel id uppercased, so nothing is configured in a page
# first. Create it with the command in README.md ("The first Admin") rather than writing values
# in a file; its shape, with placeholders, for a DingTalk app, a Feishu app, or both:
#
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: agentbox-organisation-env
#     namespace: agentbox
#   stringData:
#     DINGTALK_CLIENT_ID: REPLACE_WITH_DINGTALK_CLIENT_ID
#     DINGTALK_CLIENT_SECRET: REPLACE_WITH_DINGTALK_CLIENT_SECRET
#     FEISHU_APP_ID: REPLACE_WITH_FEISHU_APP_ID
#     FEISHU_APP_SECRET: REPLACE_WITH_FEISHU_APP_SECRET
#
# Register the callback address with the vendor, in the app's sign-in (redirect) settings:
# https://REPLACE_WITH_PUBLIC_HOST/auth/dingtalk/callback, or .../auth/feishu/callback.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentbox-organisation
  namespace: agentbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentbox-organisation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentbox-organisation
        agentbox/role: control
    spec:
      serviceAccountName: agentbox-organisation
      containers:
        - name: web
          image: fakechris/lumenbox:REPLACE_WITH_RELEASE_TAG
          command:
            - node
            - /opt/hostd/hostd.mjs
          args:
            - web
            - --host
            - 0.0.0.0
            - --port
            - "7777"
          env:
            - name: AGENTBOX_HOME
              value: /state
            # Where this server is reachable (docs/106 §5): members open it from their own
            # computers, so it is private, and private does not start without HTTPS in front.
            # AGENTBOX_PUBLIC_URL is the https:// address of the Ingress that terminates TLS for
            # the Service below (README.md, "The organisation server needs an Ingress with TLS").
            # At this level the installation token signs nobody in: the first Admin opens
            # /bootstrap, everyone else signs in as themselves.
            - name: AGENTBOX_EXPOSURE
              value: private
            - name: AGENTBOX_PUBLIC_URL
              value: https://REPLACE_WITH_PUBLIC_HOST
            - name: AGENTBOX_BOX_BACKEND
              value: kubernetes
            - name: AGENTBOX_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENTBOX_IMAGE
              value: fakechris/lumenbox:REPLACE_WITH_RELEASE_TAG
          envFrom:
            - secretRef:
                name: agentbox-organisation-env
          ports:
            - name: web
              containerPort: 7777
          readinessProbe:
            tcpSocket:
              port: web
          volumeMounts:
            - name: state
              mountPath: /state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: agentbox-organisation-state
---
apiVersion: v1
kind: Service
metadata:
  name: agentbox-organisation
  namespace: agentbox
spec:
  selector:
    app.kubernetes.io/name: agentbox-organisation
  ports:
    - name: web
      port: 7777
      targetPort: web
