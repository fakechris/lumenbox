apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentbox-organisation
  namespace: agentbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentbox-organisation
  namespace: agentbox
subjects:
  - kind: ServiceAccount
    name: agentbox-organisation
    namespace: agentbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentbox-control
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentbox-organisation-state
  namespace: agentbox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentbox-organisation
  namespace: agentbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentbox-organisation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentbox-organisation
        agentbox/role: control
    spec:
      serviceAccountName: agentbox-organisation
      containers:
        - name: web
          image: fakechris/lumenbox:0.4.7
          command:
            - node
            - /opt/hostd/hostd.mjs
          args:
            - web
            - --host
            - 0.0.0.0
            - --port
            - "7777"
          env:
            - name: AGENTBOX_HOME
              value: /state
            - name: AGENTBOX_BOX_BACKEND
              value: kubernetes
            - name: AGENTBOX_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENTBOX_IMAGE
              value: fakechris/lumenbox:0.4.7
          envFrom:
            - secretRef:
                name: agentbox-organisation-env
          ports:
            - name: web
              containerPort: 7777
          readinessProbe:
            tcpSocket:
              port: web
          volumeMounts:
            - name: state
              mountPath: /state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: agentbox-organisation-state
---
apiVersion: v1
kind: Service
metadata:
  name: agentbox-organisation
  namespace: agentbox
spec:
  selector:
    app.kubernetes.io/name: agentbox-organisation
  ports:
    - name: web
      port: 7777
      targetPort: web
