  <text x="52" y="53" fill="#F8FAFC" font-size="21" font-weight="700">从“强耦合矩阵”到“对角/三角矩阵”：LumenBox 四大核心重构实证</text>
  <text x="52" y="79" fill="#94A3B8" font-size="13">每一次重大架构演进，在公理设计上都是消除上三角非零耦合元（Off-Diagonal Coupling），使各 FR 拥有正交独立的控制旋钮</text>

