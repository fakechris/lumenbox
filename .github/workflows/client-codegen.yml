# The client API, as the phone apps will build it (docs/110 §1, INV-2213).
#
# `npm run arch` holds the OpenAPI document to additions only, and the contract tests hold the server
# to the document. Neither proves the document generates: that swift-openapi-generator (lumenbox-ios)
# and openapi-generator's Kotlin generator with kotlinx.serialization (lumenbox-android) accept it,
# that what they make compiles, and that it decodes an answer from a newer server — a field it does
# not know, a value of an open enumeration it does not list — instead of failing. That is this job.
#
# Not in `npm run check`: Swift and a JVM are not on every machine that runs the suite, and both
# fetch their generators from the network. The runner image carries Swift, Java 17 and Gradle.
# Runs when the document, the schema it comes from or this check changes, and by hand.
name: client-codegen

on:
  push:
    branches: [main]
    paths:
      - docs/api/**
      - src/web/client-api/**
      - clients/codegen/**
      - .github/workflows/client-codegen.yml
  pull_request:
    paths:
      - docs/api/**
      - src/web/client-api/**
      - clients/codegen/**
      - .github/workflows/client-codegen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: swift --version
      - name: generate with swift-openapi-generator, compile, decode a newer server's answers
        run: swift test --package-path clients/codegen/swift

  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: java -version && gradle --version
      - name: generate with openapi-generator (kotlin, kotlinx.serialization), compile, decode a newer server's answers
        run: gradle -p clients/codegen/kotlin test --console=plain
