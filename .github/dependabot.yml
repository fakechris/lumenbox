# What keeps the pins from going stale.
#
# The box image's base is pinned by digest (docker/box/Dockerfile) so that two builds a
# month apart are the same base system. A pin nobody moves is a security hole that ages,
# which is why this file exists alongside it: the pin and the thing that unfreezes it are
# one mechanism, and shipping half of it is worse than shipping neither — the digest looks
# deliberate while quietly getting older.
#
# Grouped rather than one PR per image: a base bump is reviewed and rebuilt as a unit.
#
# Minor and patch updates share a group; a major version gets a PR of its own. One group for
# everything let three majors (SDK, zod, electron) fail the type check and take four harmless
# bumps down with them (#424), so a major is now always read alone.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/docker/box"
    schedule:
      interval: weekly
    groups:
      document-libraries:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/docker/box"
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # ShowUI hands our component schemas to @a2ui, whose latest (0.14) is built on zod 3 and
      # zod-to-json-schema 3: zod 4 objects there fail at run time, not only in the type check.
      # Lift this when @a2ui supports zod 4 (INV-1438).
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
    groups:
      # The SDKs move often and are read together when one of them breaks.
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
